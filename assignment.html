<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: inline-block;
        }

        .b1, .b2, .b3, .b4 {
            border: 1px solid black;
            text-align: center;
            color: #000;
        }

        .b1 {
            background-color: rgb(242, 5, 5); 
            width: 700px;
            height: 700px;         
        }

        .b2 {
            background-color: rgb(3, 185, 246);
            position: absolute;
            top: 8px;
            left: 8px;
            height: 30px;
            width: 30px;
        }

        .b3 {
            background-color: rgb(3, 248, 3);
            margin-top: 30px;
            position: relative;
            width: 100px;
            height: 100px;
        }

        .b4 {
            background-color: rgb(246, 242, 13);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 50px;
            width: 50px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="b1">Box 1</div>
        <div class="b2">Box 2</div>
        <div class="b3">Box 3</div>
        <div class="b4">Box 4</div>
    </div>
</body>
</html>

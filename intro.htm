<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>learning on CSS</title>

    <style>
        div {
            color: goldenrod;
            font-size: 18px;
        }

        h1 {
            color: rosybrown;
            text-align: center;
        }

        h2 {
            color: peachpuff;
        }
        p {
            color: beige;
        }
    </style>
    <link rel="stylesheet" href="intro.css">
    <link rel="stylesheet" href="int.css">
</head>
<body>
    <h1>This is a heading</h1>
    <div>This is a paragraph with internal styling</div>

    <h2>A smaller heading</h2>

    <p style="color: blanchedalmond; font-size: 28px;">This is a paragraph with inline styling</p>
    <p>A paragraph without inline styling</p>

    <h3>This is a heading with External Styling</h3>

    <p>Na your body go tell you then you go knowww!</p>
</body>
</html>
